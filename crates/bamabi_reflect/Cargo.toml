[package]
name = "bamabi_reflect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Safe (`#![forbid(unsafe_code)]`) dynamic `bevy_reflect`, Bevy Remote Protocol (`bevy_remote` BRP), and `bevy_settings` TOML bridges for `bamabi`"
readme = "README.md"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = []

[dependencies]
bamabi_schema = { workspace = true, features = ["alloc"] }
bamabi_sys = { workspace = true, features = ["serde"] }
bamabi_host_sys = { workspace = true, features = ["bridge-reflect"] }
bamabi_host = { workspace = true, features = ["dynamic-loader"] }
bevy_app = { workspace = true, features = ["bevy_reflect"] }
bevy_asset = { workspace = true }
bevy_ecs = { workspace = true, features = ["bevy_reflect"] }
bevy_platform = { workspace = true }
bevy_reflect = { workspace = true }
bevy_remote = { workspace = true }
bevy-settings = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
bamabi_host_sys = { workspace = true, features = ["bridge-reflect", "test-utils"] }
bamabi_macros = { workspace = true }
